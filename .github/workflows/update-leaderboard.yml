name: Update Leaderboard

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    concurrency:
      group: leaderboard-updater
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Check whether an update is due
        id: check
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          try:
              with open("last_updated.json", "r") as f:
                  data = json.load(f)

              last_updated = datetime.fromisoformat(
                  data["lastUpdated"]
              )

              if last_updated.tzinfo is None:
                  last_updated = last_updated.replace(
                      tzinfo=timezone.utc
                  )

              now = datetime.now(timezone.utc)

              minutes_since_update = (
                  now - last_updated.astimezone(timezone.utc)
              ).total_seconds() / 60

              print(
                  f"Minutes since last update: "
                  f"{minutes_since_update:.1f}"
              )

              if minutes_since_update >= 50:
                  print("Update is due.")
                  should_update = "true"
              else:
                  print("Update is not due yet.")
                  should_update = "false"

          except (FileNotFoundError, KeyError, ValueError) as e:
              print(f"Could not read last_updated.json: {e}")
              print("Running update.")
              should_update = "true"

          with open(
              __import__("os").environ["GITHUB_OUTPUT"], "a"
          ) as f:
              f.write(f"should_update={should_update}\n")
          PY

      - name: Update leaderboard
        if: steps.check.outputs.should_update == 'true'
        run: python update_online.py

      - name: Commit and push changes
        if: steps.check.outputs.should_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily.json
          git add weekly.json
          git add monthly.json
          git add yearly.json
          git add daily_wins.json
          git add weekly_wins.json
          git add monthly_wins.json
          git add yearly_wins.json
          git add total_kills.json
          git add total_wins.json
          git add history.json
          git add stats.json
          git add last_updated.json

          if ! git diff --cached --quiet; then
            git commit -m "Update leaderboard"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changes to commit."
          fi

      - name: Update not due
        if: steps.check.outputs.should_update != 'true'
        run: |
          echo "Leaderboard update is not due yet."
          echo "Cloudflare will trigger another check soon."
