name: Update Leaderboard

on:
  schedule:
    - cron: '40 * * * *'
  workflow_dispatch:

concurrency:
  group: leaderboard-updater
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Update leaderboard
        run: python update_online.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily.json
          git add weekly.json
          git add monthly.json
          git add yearly.json
          git add daily_wins.json
          git add weekly_wins.json
          git add monthly_wins.json
          git add yearly_wins.json
          git add total_kills.json
          git add total_wins.json
          git add history.json
          git add stats.json
          git add last_updated.json

          if ! git diff --cached --quiet; then
            git commit -m "Update leaderboard"
            git push
          else
            echo "No changes to commit."
          fi
